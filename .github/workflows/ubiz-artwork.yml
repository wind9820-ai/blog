name: UBIZ artwork build
on:
  push:
    branches: [revise-ai-bizcall-images]
    paths:
      - '.github/workflows/ubiz-artwork.yml'
      - '유비즈 블로그(3개)/ubiz/tools/render_ai_bizcall.py'
permissions:
  contents: write
concurrency:
  group: ubiz-artwork-${{ github.ref }}
  cancel-in-progress: true
jobs:
  artwork:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image tools
        run: pip install Pillow==11.3.0 requests==2.32.4
      - name: Prepare illustration photographs and temporary font
        shell: python
        run: |
          from pathlib import Path
          from concurrent.futures import ThreadPoolExecutor
          import requests
          import os
          from PIL import Image
          root = Path('artwork-sources')
          root.mkdir(exist_ok=True)
          ids = [4405372, 7657480, 10376213, 6170640, 5951328, 5186349]
          def fetch(i):
              url = f'https://images.pexels.com/photos/{i}/pexels-photo-{i}.jpeg?auto=compress&cs=tinysrgb&w=2600&q=92'
              response = requests.get(url, timeout=45)
              response.raise_for_status()
              file = root / f'{i}.jpg'
              file.write_bytes(response.content)
              with Image.open(file) as image:
                  image.verify()
          with ThreadPoolExecutor(max_workers=4) as pool:
              list(pool.map(fetch, ids))
          font = Path(os.environ['RUNNER_TEMP']) / 'NanumSquareB.ttf'
          response = requests.get('https://raw.githubusercontent.com/hiun/NanumSquare/master/NanumSquareB.ttf', timeout=45)
          response.raise_for_status()
          font.write_bytes(response.content)
          with open(os.environ['GITHUB_ENV'], 'a') as env:
              env.write(f'UBIZ_FONT={font}\n')
      - name: Render seven final images
        run: python '유비즈 블로그(3개)/ubiz/tools/render_ai_bizcall.py' --photos artwork-sources --output artwork-output
      - name: Publish only generated artwork to this review branch
        shell: bash
        run: |
          ASSET_DIR='유비즈 블로그(3개)/ubiz/posts/assets/ai-bizcall'
          mkdir -p "$ASSET_DIR/jpg"
          cp artwork-output/images/*.png "$ASSET_DIR/"
          cp artwork-output/jpg/*.jpg "$ASSET_DIR/jpg/"
          cp artwork-output/preview.jpg artwork-output/PHOTO_SOURCES.txt artwork-output/manifest.json "$ASSET_DIR/"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- "$ASSET_DIR"
          if ! git diff --cached --quiet; then
            git commit -m 'Publish high-resolution AI Bizcall photographic image series'
            git pull --rebase origin "$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ubiz-ai-bizcall-premium
          path: artwork-output/
          retention-days: 14
          if-no-files-found: error
